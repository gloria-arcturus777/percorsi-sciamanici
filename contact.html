<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Contatti — Percorsi Sciamanici</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body class="bg-slate-50 text-slate-800">
  <header class="bg-white/80 sticky top-0">
    <div class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
      <a href="index.html" class="font-playfair text-xl">Percorsi Sciamanici</a>
      <nav class="flex items-center gap-4">
        <a href="index.html" class="text-slate-700 hover:text-violet-600">Home</a>
        <a href="about.html" class="text-slate-700 hover:text-violet-600">Chi sono</a>
        <a href="services.html" class="text-slate-700 hover:text-violet-600">Servizi</a>
        <a href="contact.html" class="text-slate-700 hover:text-violet-600">Contatti</a>
        <a href="contact_en.html" class="ml-4 px-3 py-1 border rounded text-sm">EN</a>
      </nav>
    </div>
  </header>

  <main class="max-w-3xl mx-auto px-6 py-16">
    <div class="bg-white p-8 rounded-lg shadow">
      <h1 class="text-2xl font-playfair mb-4">Contatti</h1>
      <p class="text-slate-600 mb-6">Compila il modulo per informazioni, richieste workshop o prenotazioni.</p>

      <form id="contact-form" action="https://formspree.io/f/yourFormID" method="POST" data-lang="it" class="space-y-4">
        <label class="block">
          <span class="text-sm font-medium text-slate-700">Nome</span>
          <input name="name" required class="mt-1 block w-full rounded-md border-slate-200 shadow-sm focus:ring-violet-500 focus:border-violet-500" />
        </label>

        <label class="block">
          <span class="text-sm font-medium text-slate-700">Email</span>
          <input name="email" type="email" required class="mt-1 block w-full rounded-md border-slate-200 shadow-sm focus:ring-violet-500 focus:border-violet-500" />
        </label>

        <label class="block">
          <span class="text-sm font-medium text-slate-700">Messaggio</span>
          <textarea name="message" rows="6" required class="mt-1 block w-full rounded-md border-slate-200 shadow-sm focus:ring-violet-500 focus:border-violet-500"></textarea>
        </label>

        <div class="flex items-center gap-4">
          <button type="submit" class="px-5 py-2 bg-violet-600 text-white rounded">Invia</button>
          <div id="form-status" class="text-sm text-slate-600"></div>
        </div>
      </form>

      <p class="text-xs text-slate-400 mt-4">Sostituisci l'azione del form con il tuo endpoint Formspree per ricevere le email.</p>
    </div>
  </main>

  <footer class="bg-white border-t">
    <div class="max-w-6xl mx-auto px-6 py-6 text-sm text-slate-500">
      © <span id="year-contact-it"></span> Percorsi Sciamanici — <a href="contact_en.html" class="text-slate-600">English</a>
    </div>
  </footer>

  <script src="assets/scripts.js"></script>
  <script>document.getElementById('year-contact-it').textContent = new Date().getFullYear();</script>
</body>
</html>
