<?xml version="1.0" encoding="UTF-8"?>
<!-- assets/images/chakra-hero-v3.svg - stylized chakra hero illustration (1600x600) -->
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600" role="img" aria-label="Chakra hero illustration">
  <defs>
    <radialGradient id="cg" cx="50%" cy="40%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#f5f3ff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#eefffb"/>
    </radialGradient>
    <linearGradient id="lg" x1="0" x2="1">
      <stop offset="0" stop-color="#7c3aed" />
      <stop offset="1" stop-color="#14b8a6" />
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#cg)" />
  <g transform="translate(800,300)" text-anchor="middle">
    <!-- larger concentric rings for hero scale -->
    <circle r="260" fill="none" stroke="#7c3aed" stroke-width="42" opacity="0.95" />
    <circle r="200" fill="none" stroke="#a78bfa" stroke-width="34" opacity="0.95" />
    <circle r="140" fill="none" stroke="#34d399" stroke-width="34" opacity="0.95" />
    <circle r="90" fill="none" stroke="#06b6d4" stroke-width="28" opacity="0.95" />
    <circle r="32" fill="#fff" />
    <g stroke="#7c3aed" stroke-opacity="0.14" stroke-width="12">
      <path d="M-360 -40 L-560 -240" />
      <path d="M360 -40 L560 -240" />
      <path d="M-360 40 L-560 240" />
      <path d="M360 40 L560 240" />
    </g>
  </g>
  <g fill="#ffffff" opacity="0.18">
    <circle cx="1300" cy="80" r="8" />
    <circle cx="1320" cy="100" r="5" />
    <circle cx="1360" cy="60" r="6" />
  </g>
  <text x="50" y="550" font-family="Inter, Arial, sans-serif" font-size="20" fill="#0f172a" opacity="0.6">Percorsi Sciamanici — Chakra hero</text>
</svg>
