<?xml version="1.0" encoding="UTF-8"?>
<!-- assets/images/chakra.svg - stylized chakra illustration (vector) -->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-label="Chakra illustration">
  <defs>
    <radialGradient id="cg" cx="50%" cy="40%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#f5f3ff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#eefffb"/>
    </radialGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#cg)" />
  <g transform="translate(600,300)" text-anchor="middle">
    <!-- chakras as concentric colored rings -->
    <circle r="170" fill="none" stroke="#7c3aed" stroke-width="28" opacity="0.95" />
    <circle r="130" fill="none" stroke="#a78bfa" stroke-width="22" opacity="0.95" />
    <circle r="90" fill="none" stroke="#34d399" stroke-width="22" opacity="0.95" />
    <circle r="50" fill="none" stroke="#06b6d4" stroke-width="20" opacity="0.95" />
    <circle r="20" fill="#fff" />
    <!-- gentle rays -->
    <g stroke="#7c3aed" stroke-opacity="0.18" stroke-width="8">
      <path d="M-220 -20 L-300 -120" />
      <path d="M220 -20 L300 -120" />
      <path d="M-220 20 L-300 120" />
      <path d="M220 20 L300 120" />
    </g>
    <text y="220" font-family="Inter, Arial, sans-serif" font-size="18" fill="#0f172a" opacity="0.6">Chakra — Energy balance</text>
  </g>
</svg>
