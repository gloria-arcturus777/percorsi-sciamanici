<?xml version="1.0" encoding="UTF-8"?>
<!-- assets/images/reiki.svg - simple reiki-like symbol -->
<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400" role="img" aria-label="Reiki symbol illustration">
  <defs>
    <linearGradient id="rg" x1="0" x2="1">
      <stop offset="0" stop-color="#7c3aed" />
      <stop offset="1" stop-color="#14b8a6" />
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="#fff" />
  <g transform="translate(200,200)" fill="none" stroke="url(#rg)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <circle r="140" stroke-opacity="0.14" />
    <path d="M-70 -40 q70 -80 140 0" />
    <path d="M-90 40 q90 -100 180 0" stroke-opacity="0.9" />
    <circle r="12" cx="0" cy="0" fill="url(#rg)" stroke="none" />
  </g>
  <text x="200" y="380" font-family="Inter, Arial, sans-serif" font-size="14" fill="#0f172a" opacity="0.6" text-anchor="middle">Energy medicine — symbols</text>
</svg>
